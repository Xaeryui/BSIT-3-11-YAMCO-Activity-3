<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Me</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Me</ion-title>
    </ion-toolbar>
  </ion-header>

    <div *ngIf="me" class="ion-text-center ion-padding">
    <ion-avatar style="margin: 0 auto 16px auto; width: 80px; height: 80px;">
      <img [src]="me.image">
    </ion-avatar>

    <ion-list>
      <ion-item>
        <ion-label>Name</ion-label>
        <p>{{ me.name }}</p>
      </ion-item>

      <ion-item>
        <ion-label>Username</ion-label>
        <p>{{ me.username }}</p>
      </ion-item>

      <ion-item>
        <ion-label>Email</ion-label>
        <p>{{ me.email }}</p>
      </ion-item>

      <ion-item>
        <ion-label>Address</ion-label>
        <p>{{ me.address }}</p>
      </ion-item>
    </ion-list>
  </div>

</ion-content>
